# Release: on a version tag (vX.Y.Z), run every test suite, build the assets with tools/release.py and publish them
# with gh release (KIT_SPEC 10.7). The release notes are the CHANGELOG.md section for that version. The repository
# names MrHashMe as its owner; a fork's owner name is filled in the archive copy only.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all test suites
        run: python tools/ci.py all

      - name: Build release assets
        env:
          UB_OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/release.py --version "$version" --owner "$UB_OWNER" --out dist/
          ls -l dist/

      - name: Check the rendered shims
        run: |
          sh -n dist/install.sh
          cd dist && sha256sum -c SHA256SUMS

      - name: Write the release notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The "## <version>" section of CHANGELOG.md, without the heading; generated notes if it is missing.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; GitHub will generate the notes."
          fi
          cat release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One publishing path: this workflow. If a release for the tag already exists (for example it was made by
          # hand with gh release create), replace its assets instead of failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/*               --verify-tag               --title "ultimate-brainstorm $GITHUB_REF_NAME"               --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*               --verify-tag               --title "ultimate-brainstorm $GITHUB_REF_NAME"               --generate-notes
          fi

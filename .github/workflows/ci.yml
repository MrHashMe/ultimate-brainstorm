# CI (KIT_SPEC 11.8): every suite on 3 OSes x Python {3.9 where available, 3.12, 3.14}, plus an optional
# `claude plugin validate` job [U-17]. The Windows rows also run the bootstrap tests in Git Bash and Windows PowerShell 5.1
# (tests/integration/test_bootstrap.py finds both shells itself). release.yml calls this workflow on the tagged commit
# before it builds anything (workflow_call). Every action is pinned to a full commit SHA; the tag is in the comment.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  test:
    name: tests (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.14"]
        exclude:
          # setup-python has no 3.9 build for the arm64 macOS runners
          - os: macos-latest
            python: "3.9"
    env:
      UB_CI_STRICT: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Run every suite
        # --timeout bounds each suite (a silent hang is killed with its process tree); timeout-minutes bounds the job
        run: python tools/ci.py all --timeout 1500

  claude-plugin-validate:
    name: claude plugin validate (optional) [U-17]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code (the version install/targets.json was verified with)
        run: npm install -g @anthropic-ai/claude-code@2.1.280
      - name: Validate the plugin
        run: claude plugin validate . --strict

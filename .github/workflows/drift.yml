# Weekly drift check (KIT_SPEC 11.8): fetch vercel-labs/skills src/agents.ts and compare the skill folders it lists for
# claude-code, codex, kimi-code-cli and zcode with the explicit expected map in tools/validate_kit.py (EXPECTED_UPSTREAM;
# the same tested code as tests/static). On a mismatch (or when agents.ts can no longer be parsed) it opens ONE issue,
# titled without a date, and later comments on that open issue only when the report changed. A failed download fails
# the run (a red run notifies the maintainer) and opens nothing. It never edits the repository.
name: drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download agents.ts
        run: >-
          curl -fsSL --retry 3 --retry-all-errors -o agents.ts
          https://raw.githubusercontent.com/vercel-labs/skills/main/src/agents.ts

      - name: Compare agents.ts with the expected folders
        id: compare
        run: |
          set +e
          python tools/validate_kit.py --drift-agents-ts agents.ts --report drift-report.md
          rc=$?
          set -e
          case "$rc" in
            0) echo "drift=no" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::validate_kit.py exited $rc"; exit "$rc" ;;
          esac

      - name: Open the drift issue, or update the open one
        if: steps.compare.outputs.drift == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="targets.json drift vs vercel-labs/skills agents.ts"
          marker=$(grep -o 'drift-sha: [0-9a-f]*' drift-report.md)
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file drift-report.md
          elif gh issue view "$number" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' \
              | grep -qF "$marker"; then
            echo "Issue #$number already holds this report."
          else
            gh issue comment "$number" --body-file drift-report.md
          fi
